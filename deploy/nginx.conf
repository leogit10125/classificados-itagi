server {
    listen 8080;
    server_name _;

    # Permite envio de fotos sem erro de tamanho
    client_max_body_size 50M;

    # ========================================================
    # CABEÇALHOS DE SEGURANÇA (OWASP HARDENING)
    # ========================================================
    # Impede que o site seja embutido em iframes falsos (Anti-Clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Impede execução de arquivos com tipos falsos (Anti-MIME Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Protege dados de navegação ao clicar em links externos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Força uso de conexão criptografada HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Bloqueia acesso não autorizado a microfone e câmera
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Pasta onde a Dado Cloud guarda os arquivos do React compilado
    root /usr/share/nginx/html;
    index index.html;

    # Repasse da API para o Node.js
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Repasse dos uploads de fotos
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Entrega da página React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
